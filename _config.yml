# ─────────────────────────────────────────────────────────────
#  BLA Handbook — site settings
#  Most people never need to touch this file.
#  Lines marked  # ← EDIT  are the ones the owner may change.
# ─────────────────────────────────────────────────────────────

title: BLA Handbook
description: Handbook of the Bicultural Leaders Academy (双文化领袖学研中心), River Valley High School
timezone: Asia/Singapore
lang: en

# Web address of the site
url: "https://arkdein.github.io"           # ← EDIT if the repository moves
baseurl: "/bla-handbook"                   # ← EDIT if the repository is renamed

# While true: search engines are told not to list the site and the
# TODO boxes show. Set to false when the handbook goes live.
draft: true                                # ← EDIT at go-live

# The Administrative SOP (Google Doc). Only BLA teachers and EXCO members
# who have been given access can open it; everyone else is refused.
sop_url: "https://docs.google.com/document/d/1nfX_KyN75VFOFkB5qq0k9B3hB80WvsKo9Hc9jf3AwsQ/edit"   # ← EDIT if the SOP moves

# Key dates: the year shown on the Key Dates pages and in the calendar file.
# The dates themselves are in _data/key_dates.csv (see EDITING.md).
dates_year: 2027                           # ← EDIT each November
dates_tentative: true                      # ← EDIT: false once the school calendar confirms the dates

# Design (Just the Docs theme, loaded by GitHub)
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

relative_links:
  enabled: true

color_scheme: bla
logo_file: "/assets/images/bla-logo-480.png"
search_enabled: true
heading_anchors: true

kramdown:
  toc_levels: 1..3
back_to_top: true
back_to_top_text: "Back to top"

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: red
  deadline:
    title: Deadline
    color: yellow
  tip:
    title: Tip
    color: green
  note_zh:
    title: 注意
    color: blue
  important_zh:
    title: 重要
    color: red
  deadline_zh:
    title: 截止
    color: yellow
  tip_zh:
    title: 提示
    color: green

# Files that stay in the repository but are not published
exclude:
  - README.md
  - EDITING.md
  - tests/
  - Gemfile
  - Gemfile.lock
